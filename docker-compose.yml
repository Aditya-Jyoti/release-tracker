services:
  bot:
    build: .
    image: telegram-release-tracker:latest
    container_name: release-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/tracker.db
    volumes:
      - tracker-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tracker-data:
